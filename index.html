<style>
:root,html[data-theme=cozy]{
  --bg0:#EEE7DC; --bg1:#F8F4EE; --bg2:#F1EBE2; --bg3:#E7DED1; --bg4:#DACFC0;
  --line:#E7DED2; --line2:#D9CDBD;
  --tx:#2F2924; --mut:#7D7165; --dim:#A6998B;
  --acc:#D9774B; --acc-ink:#FFFFFF; --hot:#D9774B; --warn:#C9822B; --blue:#4C7DC9; --cyan:#2F9E98; --violet:#8A6CC7;
  --canvas:#E6DED2; --backdrop:rgba(70,52,34,.28); --pop:0 16px 40px rgba(80,60,40,.18);
  --font:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
}
html[data-theme=cozy-dark]{
  --bg0:#1C1916; --bg1:#24201C; --bg2:#2D2823; --bg3:#38312B; --bg4:#453D35;
  --line:#322C26; --line2:#3F372F;
  --tx:#F0E7DB; --mut:#A99B8B; --dim:#76695C;
  --acc:#E8936A; --acc-ink:#1C1916; --hot:#F0915F; --warn:#E3A050; --blue:#7FA6E0; --cyan:#5CC4BC; --violet:#B39BEA;
  --canvas:#191613; --backdrop:rgba(10,8,6,.55); --pop:0 16px 40px rgba(0,0,0,.5);
}
html[data-theme=slate]{
  --bg0:#0B0C0E; --bg1:#121317; --bg2:#191B20; --bg3:#22252C; --bg4:#2B2F37;
  --line:#25282F; --line2:#30343C;
  --tx:#E8E9EC; --mut:#8D929C; --dim:#5D626C;
  --acc:#C6FF3D; --acc-ink:#0B0C0E; --hot:#FF3B7F; --warn:#FF8A3D; --blue:#3D7BFF; --cyan:#2FE6FF; --violet:#9B7BFF;
  --canvas:#1C1E23; --backdrop:rgba(5,6,8,.6); --pop:0 16px 40px rgba(0,0,0,.6);
}
html[data-theme=slate-light]{
  --bg0:#F3F4F6; --bg1:#FFFFFF; --bg2:#F2F3F5; --bg3:#E8EAED; --bg4:#DADDE2;
  --line:#E6E8EB; --line2:#D6D9DE;
  --tx:#16181B; --mut:#6A707A; --dim:#9AA0A8;
  --acc:#1F2328; --acc-ink:#FFFFFF; --hot:#FF3B7F; --warn:#E07A1F; --blue:#3D7BFF; --cyan:#0FB5C9; --violet:#7A5CFF;
  --canvas:#E9EBEE; --backdrop:rgba(20,24,30,.3); --pop:0 16px 40px rgba(20,24,30,.16);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--tx);font:12px/1.4 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg{display:block}
::selection{background:var(--hot);color:#fff}
#app{display:grid;grid-template-columns:46px 240px 1fr 280px;grid-template-rows:46px 1fr;height:100vh}
#top{user-select:none;grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 10px 0 8px;background:var(--bg0);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;padding:0 8px 0 2px;font-weight:800;letter-spacing:-.02em;font-size:14px}
.brand svg{width:auto;height:19px;color:var(--tx)}
.menus{display:flex;gap:2px;margin-right:6px}
.menus button{padding:6px 9px;border-radius:6px;color:var(--mut);font-weight:500}
.menus button:hover,.menus button.on{background:var(--bg3);color:var(--tx)}
#docname{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;width:200px;font-weight:600}
#docname:hover{border-color:var(--line2)}#docname:focus{outline:none;border-color:var(--acc);background:var(--bg2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;background:var(--bg2);color:var(--mut);font-size:11px;font-weight:500;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.pill.ok i{background:var(--acc)}.pill.busy i{background:var(--blue);animation:pulse 1s infinite}.pill.bad i{background:var(--warn)}.pill.ro{color:var(--hot)}.pill.ro i{background:var(--hot)}
button.pill{cursor:pointer}button.pill.on{background:var(--cyan);color:#0B0C0E}button.pill.on i{background:#0B0C0E}
@keyframes pulse{50%{opacity:.3}}
.spacer{flex:1}
#peers{display:flex;align-items:center;margin-right:6px}
#peers img{width:26px;height:26px;border-radius:50%;border:2px solid var(--bg0);margin-left:-6px;background:var(--bg3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border-radius:7px;font-weight:600;white-space:nowrap}
.btn svg{width:14px;height:14px}
.btn.ghost{background:var(--bg2);border:1px solid var(--line2)}.btn.ghost:hover{background:var(--bg3)}
.btn.primary{background:var(--acc);color:var(--acc-ink)}.btn.primary:hover{filter:brightness(1.08)}
.btn.hot{background:var(--hot);color:#fff}
.btn.wide{width:100%}
a.btn{text-decoration:none}
.btn:disabled{opacity:.4;cursor:default}
#rail{background:var(--bg0);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;overflow:auto}
.tool{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--mut);position:relative;flex:none}
.tool svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--bg3);color:var(--tx)}
.tool.on{background:var(--acc);color:var(--acc-ink)}
.tool .tip{position:fixed;left:54px;background:var(--bg4);color:var(--tx);padding:4px 8px;border-radius:6px;white-space:nowrap;font-size:11px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:50;transform:translateY(-28px)}
.tool .tip kbd{color:var(--acc);margin-left:6px;font-family:inherit}
.tool:hover .tip{opacity:1}
.rsep{width:22px;height:1px;background:var(--line2);margin:6px 0;flex:none}
aside{background:var(--bg1);overflow:hidden;display:flex;flex-direction:column;min-height:0}
#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line)}
.tabs{user-select:none;display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);flex:none}
.tabs button{padding:7px 10px 9px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--tx);border-color:var(--acc)}
.scroll{overflow:auto;flex:1;min-height:0}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:8px;border:2px solid var(--bg1)}
#layers{padding:6px 0}
.lrow{display:flex;align-items:center;gap:6px;height:28px;padding-right:6px;cursor:default;color:var(--tx);border-top:1px solid transparent;border-bottom:1px solid transparent;user-select:none}
.lrow:hover{background:var(--bg2)}
.lrow.on{background:color-mix(in srgb,var(--hot) 18%,transparent)}
.lrow.on .ln{color:var(--tx)}
.lrow.hid .ln,.lrow.hid .li{opacity:.4}
.lrow.ab{font-weight:600}
.lrow .car{width:12px;font-style:normal;color:var(--dim);cursor:pointer;transition:transform .15s;text-align:center;flex:none}
.lrow .car.col{transform:rotate(-90deg)}
.lrow .li{width:16px;height:16px;color:var(--mut);flex:none}
.lrow .li svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
.lrow.ab .li{color:var(--acc)}.lrow.cmp .li,.lrow.cmp .ln{color:var(--violet)}
.lrow .ln{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ln[contenteditable=true]{background:var(--bg0);outline:1px solid var(--acc);padding:1px 4px;border-radius:3px;text-overflow:clip}
.lrow .la{width:22px;height:22px;display:grid;place-items:center;color:var(--dim);opacity:0;border-radius:5px;cursor:pointer;flex:none}
.lrow .la svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7}
.lrow:hover .la,.lrow .la.act{opacity:1}.lrow .la:hover{background:var(--bg4);color:var(--tx)}
.lrow .tag{font-size:9px;font-weight:700;color:var(--cyan);border:1px solid currentColor;border-radius:4px;padding:0 3px;flex:none}
.lrow.dz-above{border-top-color:var(--acc)}.lrow.dz-below{border-bottom-color:var(--acc)}.lrow.dz-in{background:color-mix(in srgb,var(--acc) 15%,transparent)}
.empty{padding:24px 16px;color:var(--dim);text-align:center;line-height:1.6}
.asec{padding:10px 12px;border-bottom:1px solid var(--line)}
.asec h5{margin:0 0 8px;font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
details.cat{margin:0 -4px}
details.cat summary{list-style:none;cursor:pointer;padding:6px 4px;border-radius:6px;font-weight:600;display:flex;align-items:center;gap:6px}
details.cat summary::before{content:'▸';color:var(--dim);transition:.15s;font-size:10px}
details.cat[open] summary::before{transform:rotate(90deg)}
details.cat summary:hover{background:var(--bg2)}
.plist{display:grid;gap:2px;padding:2px 0 6px 16px}
.pbtn{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;text-align:left;color:var(--tx);gap:8px}
.pbtn:hover{background:var(--bg3)}.pbtn small{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcard{border:1px solid var(--line2);border-radius:10px;overflow:hidden;text-align:left;background:var(--bg2)}
.tcard:hover{border-color:var(--acc)}
.tcard .tv{aspect-ratio:1;display:grid;place-items:center;font-weight:800;letter-spacing:-.02em}
.tcard span{display:block;padding:6px 8px;font-size:11px;color:var(--mut)}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qbtn{aspect-ratio:1;border-radius:9px;background:var(--bg2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--mut)}
.qbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.qbtn:hover{color:var(--acc);border-color:var(--acc)}
.cbtn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:7px;color:var(--tx);text-align:left}
.cbtn:hover{background:var(--bg3)}.cbtn svg{width:16px;height:16px;fill:none;stroke:var(--violet);stroke-width:1.6;flex:none}
.cbtn small{margin-left:auto;color:var(--dim)}
/* canvas */
#cv{position:relative;overflow:hidden;background:var(--canvas);cursor:default;touch-action:none}
#cv.panning,#cv.panning *{cursor:grab!important}
#cv.t-cross{cursor:crosshair}#cv.t-text{cursor:text}
#stage,#hud{position:absolute;inset:0;width:100%;height:100%}
#hud{pointer-events:none;overflow:visible}
#hud .hdl{fill:#fff;stroke:var(--hot);stroke-width:1.5;pointer-events:all}
#hud .rot{fill:var(--hot);stroke:#fff;stroke-width:1.5;pointer-events:all;cursor:grab}
#hud .gd{pointer-events:stroke}
#labels,#cursors{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ablabel{position:absolute;pointer-events:auto;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0;cursor:default;user-select:none;font-weight:500}
.ablabel:hover{color:var(--tx)}
.ablabel.on{color:var(--hot);font-weight:600}
.ablabel small{color:var(--dim);margin-left:6px;font-weight:400}
.cur{position:absolute;left:0;top:0;transition:transform .08s linear}
.cur svg{width:18px;height:18px}
.cur span{position:absolute;left:14px;top:16px;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:600;color:#0B0C0E;white-space:nowrap}
#texted{position:absolute;background:transparent;border:0;outline:1px solid var(--hot);resize:none;overflow:hidden;white-space:pre;padding:0;margin:0;caret-color:var(--hot);z-index:5}
#zoombar{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;background:var(--bg1);border:1px solid var(--line2);border-radius:9px;padding:3px;gap:2px;box-shadow:0 6px 20px #0006}
#zoombar button{height:26px;min-width:26px;padding:0 7px;border-radius:6px;color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}
#zoombar button:hover{background:var(--bg3);color:var(--tx)}
#hintbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--bg1);border:1px solid var(--line2);border-radius:99px;padding:6px 14px;color:var(--mut);font-size:11px;pointer-events:none;white-space:nowrap}
#hintbar b{color:var(--acc);font-weight:600}
#banner{position:absolute;left:50%;top:30px;transform:translateX(-50%);background:var(--hot);color:#fff;border-radius:99px;padding:6px 14px;font-weight:600;font-size:11px;box-shadow:0 6px 20px #0006}
#rulerH,#rulerV,#rcorner{position:absolute;z-index:3}
#rulerH{left:20px;top:0;right:0;height:20px;cursor:row-resize}
#rulerV{left:0;top:20px;bottom:0;width:20px;cursor:col-resize}
#rcorner{left:0;top:0;width:20px;height:20px;background:var(--bg1);border-right:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mut);font-size:8px;font-weight:700;display:grid;place-items:center;cursor:pointer;text-transform:uppercase}
#rcorner:hover{color:var(--acc)}
#cv.norulers #rulerH,#cv.norulers #rulerV,#cv.norulers #rcorner{display:none}
#cv.proof #world{filter:url(#proofF)}
/* right panel */
#rpanel{padding-bottom:30px}
#rpanel fieldset{border:0;margin:0;padding:0;min-width:0}
.phead{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.ptype{font-size:11px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.ptype.cmp{color:var(--violet)}
.pname{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:5px;padding:3px 6px;font-weight:600}
.pname:hover{border-color:var(--line2)}.pname:focus{outline:none;border-color:var(--acc)}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h4{margin:0 0 10px;font-size:11px;font-weight:600;color:var(--mut);display:flex;align-items:center;justify-content:space-between;text-transform:uppercase;letter-spacing:.06em}
.sec h4 .chk{text-transform:none;letter-spacing:0}
.sec h4 .new{color:var(--acc-ink);background:var(--acc);font-size:9px;padding:1px 5px;border-radius:4px;letter-spacing:.04em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g4c{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.g4+.g4,.g2+.g2,.g3+.g3,.mt{margin-top:6px}
.fld{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:6px;height:28px;padding-left:8px;min-width:0}
.fld:focus-within{border-color:var(--acc)}
.fld span{color:var(--dim);font-size:11px;min-width:14px;font-weight:600;white-space:nowrap}
.fld input{flex:1;min-width:0;width:100%;background:transparent;border:0;padding:0 6px;height:100%;font-variant-numeric:tabular-nums}
.fld input:focus{outline:none}
input[type=number]::-webkit-inner-spin-button{opacity:.3}
select{width:100%;height:28px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:0 6px}
select:focus{outline:none;border-color:var(--acc)}
.colf{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;height:28px;padding:0 4px;min-width:0}
.colf:focus-within{border-color:var(--acc)}
.colf input[type=color]{width:20px;height:20px;border:0;padding:0;background:none;border-radius:4px;cursor:pointer;flex:none}
.colf input[type=color]::-webkit-color-swatch-wrapper{padding:0}.colf input[type=color]::-webkit-color-swatch{border:1px solid #fff3;border-radius:4px}
.colf input[type=text]{flex:1;min-width:0;background:transparent;border:0;font-variant-numeric:tabular-nums;text-transform:uppercase}
.colf input[type=text]:focus{outline:none}
.cmyk{display:grid;grid-template-columns:repeat(4,1fr) 18px;gap:4px;margin-top:4px;align-items:center}
.cmyk label{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:5px;height:24px;padding-left:5px}
.cmyk label:focus-within{border-color:var(--acc)}
.cmyk span{font-size:10px;font-weight:700}
.cmyk span.c{color:#2FE6FF}.cmyk span.m{color:#FF3B7F}.cmyk span.y{color:#D4A800}.cmyk span.k{color:var(--mut)}
.cmyk input{width:100%;min-width:0;background:transparent;border:0;padding:0 3px;font-size:11px}
.cmyk input:focus{outline:none}
.cmyk input::-webkit-inner-spin-button{display:none}
.gw{color:var(--warn);font-size:13px;cursor:help;text-align:center}
.ib{width:24px;height:24px;display:grid;place-items:center;border-radius:5px;color:var(--mut);flex:none}
.ib:hover{background:var(--bg4);color:var(--tx)}

/* menus */
.pop{position:fixed;z-index:200;background:var(--bg1);border:1px solid var(--line2);border-radius:10px;padding:5px;min-width:230px;box-shadow:var(--pop);max-height:calc(100vh - 60px);overflow:auto}

.plg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}

.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}

.copyrow{display:flex;gap:6px}.copyrow input{flex:1;height:30px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:0 8px;font-family:'JetBrains Mono',monospace;font-size:11px}

const dz=(e,r)=>{const b=r.getBoundingClientRect(),f=(e.clientY-b.top)/b.height,t=N(r.dataset.id),a=N(ldrag);if(t&&a&&isCont(t)&&a.type!=='artboard'&&f>.25&&f<.75)return'in';return f<.5?'above':'below'};
lay.addEventListener('dragover',e=>{const r=e.target.closest('.lrow');if(!r||!ldrag)return;e.preventDefault();$$('.lrow',lay).forEach(x=>x.classList.remove('dz-above','dz-below','dz-in'));r.classList.add('dz-'+dz(e,r))});
lay.addEventListener('drop',e=>{const r=e.target.closest('.lrow');if(!r||!ldrag)return;e.preventDefault();layerDrop(ldrag,r.dataset.id,dz(e,r));ldrag=null});
lay.addEventListener('dragend',()=>{ldrag=null;$$('.lrow',lay).forEach(x=>x.classList.remove('dz-above','dz-below','dz-in'))});
function layerDrop(did,tid,zone){
  if(did===tid||S.readOnly)return;const a=N(did),t=N(tid);if(!a||!t)return;if(ancestors(t).some(x=>x.id===did))return;
  if(t.type==='instance'&&false)return;
  hist();const arr=S.doc.nodes;arr.splice(arr.indexOf(a),1);
  if(a.type==='artboard'){const tt=artboardOf(t)||t;const i=arr.indexOf(tt);arr.splice(zone==='below'?i:i+1,0,a)}
  else if(zone==='in'&&isCont(t)){a.parent=t.id;arr.push(a)}
  else{a.parent=t.type==='artboard'?null:t.parent;const i=arr.indexOf(t);arr.splice(zone==='above'?i+1:i,0,a)}
  changed(true);
}

function harmony(hex,mode){
  const toHsl=h=>{let[r,g,b]=toRgb(h).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let H=0,S2=0,L=(mx+mn)/2;if(mx!==mn){const d=mx-mn;S2=L>.5?d/(2-mx-mn):d/(mx+mn);H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;H*=60}return[H,S2,L]};
  const toHex=(h,s,l)=>{h=((h%360)+360)%360;const a=s*Math.min(l,1-l),f=k=>{const c=(k+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(c-3,9-c,1))))};return'#'+[f(0),f(8),f(4)].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase()};
  const[h,s,l]=toHsl(hex);const m={complementary:[0,180,0,180],analogous:[-30,0,30,60],triadic:[0,120,240,60],tetradic:[0,90,180,270],split:[0,150,210,30]}[mode];
  if(mode==='mono')return[.2,.35,.5,.65,.82].map(L=>toHex(h,s,L));
  return m.map((d,i)=>toHex(h+d,s,i===3&&mode==='complementary'?Math.min(.9,l+.3):i===2&&mode==='complementary'?Math.max(.12,l-.25):l)).concat([toHex(h,s*.25,.94)]);
}

    await frame(0);rec.start(250);const t0=performance.now();

/* ============================== text wrapping ============================== */
function textLines(n){
  const raw=String(n.text??'').split('\n');
  if(!n.tr||n.tr==='auto')return raw;
  mctx.font=fontOf(n);const W=Math.max(1,n.w)+.5,ls=n.ls||0,wid=s=>mctx.measureText(s).width+ls*[...s].length,out=[];
  for(const para of raw){
    let line='';const push=()=>{out.push(line.replace(/\s+$/,''));line=''};
    for(const w of para.split(/(\s+)/)){
      if(!w)continue;
      if(/^\s+$/.test(w)){line+=w;continue}
      if(line.trim()&&wid(line+w)>W)push();
      if(!line.trim()&&wid(line+w)>W){for(const ch of w){if(line&&wid(line+ch)>W)push();line+=ch}}
      else line+=w;
    }
    out.push(line.replace(/\s+$/,''));
  }
  return out;
}

  const fid=C.fileId,col=C.db.collection(`files/${fid}/nodes`);let big=0,ops=[];

      const prev=C.synced.get(n.id);C.synced.set(n.id,js);
      ops.push(()=>col.doc(n.id).set(JSON.parse(js)).catch(e=>{if(C.synced.get(n.id)===js){prev===undefined?C.synced.delete(n.id):C.synced.set(n.id,prev)}throw e}))});
    for(const id of[...C.synced.keys()])if(!cur.has(id)){const prev=C.synced.get(id);C.synced.delete(id);ops.push(()=>col.doc(id).delete().catch(e=>{C.synced.set(id,prev);throw e}))}
    const meta=sanitizeMeta(metaOf(),newDoc()),mjs=stable(meta);
    if(ops.length||mjs!==C.metaJs){
      setSync('saving');
      for(let i=0;i<ops.length;i+=8)await Promise.all(ops.slice(i,i+8).map(f=>f()));
      if(Date.now()-C.thumbT>6000||!C.thumb){C.thumbT=Date.now();const t=await makeThumb();if(t)C.thumb=t}
      C.metaJs=mjs;
      await C.db.doc('files/'+fid).set(Object.assign({},metaOf(),{updated:Date.now(),by:C.me?.id||null,owner:C.owner||C.me?.id||null,count:S.doc.nodes.length,thumb:C.thumb||''}));
    }
    if(C.fileId===fid)setSync('synced');
    if(big)toast(`${big} layer${big>1?'s are':' is'} too large to sync — try a smaller image or simpler outlines`,4000);
  }catch(e){
    const code=e&&e.code;
    if(code==='invalid_argument'){C.canWrite=false;setReadOnly(true);toast('You have view access to this file')}
    else if(code==='quota_exceeded'){setSync('error','Storage full');toast('Cloud storage is full: '+(e.message||''),5000)}

}

function bootDoc(){
  const t=loadTabs('slab.tabs');
  if(t&&Array.isArray(t.tabs)&&t.tabs.length){S.tabs=t.tabs.filter(x=>x&&x.id&&localGet(x.id)).map(x=>({id:cleanId(x.id),name:String(x.name||'Untitled')}));const id=S.tabs.some(x=>x.id===t.active)?t.active:S.tabs[0]&&S.tabs[0].id;const raw=id&&localGet(id);if(raw){S.doc=sanitizeDoc(raw);S.doc.id=id;return}}
  let local=null;try{local=JSON.parse(localStorage.getItem('slab.local')||'null')}catch{}
  if(local&&Array.isArray(local.nodes)&&local.nodes.length){S.doc=sanitizeDoc(local);try{localStorage.removeItem('slab.local')}catch{}}else seed();
  S.doc.id=uid();
}
function boot(){
  applyTheme(document.documentElement.dataset.theme||'cozy');
  buildRail();renderAssets();setTool('select');
  bootDoc();addTab(S.doc.id,S.doc.name);persistNow();
  $('#docname').value=S.doc.name;$('#proofBtn').hidden=S.doc.mode!=='cmyk';
  renderAll(true);requestAnimationFrame(()=>{zoomFit()});
  if(document.fonts)document.fonts.ready.then(()=>{S.doc.nodes.forEach(n=>{if(n.type==='text')fitText(n)});renderStage();renderHUD()});
  $('#rail').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(b)setTool(b.dataset.tool)});
  window.addEventListener('resize',()=>renderView());
  if(!parseHash())showHome();
  initCaps();
}
boot();
</script>
</body>
</html>
